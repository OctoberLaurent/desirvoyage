volumes:
    mysqldata: ~

services:
    db:
        container_name: db
        image: mariadb:10.5
        # command: ["--default-authentication-plugin=mysql_native_password"]
        ports:
            - "8889:3306"
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: dock
            MYSQL_USER: symfony
            MYSQL_PASSWORD: symfony
        networks:
            - db
    php:
        container_name: php-fpm
        build: ./php-fpm
        ports:
            - "9000:9001"
        volumes:
            - ../:/var/www/symfony
            - ./logs/symfony:/var/www/symfony/var/log:cached

        depends_on:
            - db
        networks:
            - db
            - php
    phpmyadmin:
        container_name: phpmyadmin
        image: phpmyadmin/phpmyadmin
        ports:
            - "8080:80"
        depends_on:
            - db
        networks:
            - db
            - php
    nginx:
        container_name: nginx
        build: ./nginx
        ports:
            - "8888:80"
        depends_on:
            - php
        networks:
            - php
        volumes:
            - ./logs/nginx:/var/log/nginx:cached
            - ../:/var/www/symfony:cached
    cypress:
        container_name: cypress
        image: cypress/included:13.17.0
        shm_size: 2gb
        ipc: host
        cap_add:
            - SYS_ADMIN
            - IPC_LOCK
        security_opt:
            - seccomp:unconfined
        environment:
            - CYPRESS_BASE_URL=http://nginx
            - QT_X11_NO_MITSHM=1
            - _X11_NO_MITSHM=1
            - DISABLE_DEV_SHM_USAGE=1
            - ELECTRON_EXTRA_LAUNCH_ARGS=--no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer
        working_dir: /e2e
        volumes:
            - ../cypress:/e2e/cypress
            - ../cypress.config.js:/e2e/cypress.config.js
            - ../package.json:/e2e/package.json
            - ../cypress/screenshots:/e2e/cypress/screenshots
            - ../cypress/videos:/e2e/cypress/videos
        depends_on:
            - nginx
        networks:
            - php
networks:
    db:
    php:
