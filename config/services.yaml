# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices/configuration.html#application-related-configuration
parameters:
    stripe.public_key: '%env(default::STRIPE_PUBLIC_KEY)%'
    stripe.secret_key: '%env(default::STRIPE_SECRET_KEY)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            string $projectDir: '%kernel.project_dir%'
            string $stripePublicKey: '%stripe.public_key%'
            string $secretKey: '%stripe.secret_key%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/*'
        exclude: '../src/{DependencyInjection,Entity,Migrations,Kernel.php}'

    # controllers are imported separately to make sure services can be injected
    # as action arguments even if you don't extend any base controller class
    App\Controller\:
        resource: '../src/Controller'
        tags: ['controller.service_arguments']

    # Payment port alias for the Stripe adapter (skill §1 DIP, §2 Adapter)
    App\Service\Payment\PaymentGatewayInterface: '@App\Service\Payment\StripePaymentGateway'
    App\Service\Payment\StripePaymentGateway:
        arguments:
            $secretKey: '%stripe.secret_key%'

    # Persistence ports backed by Doctrine implementations (skill §1 DIP, §3 Repository)
    App\Repository\ReservationRepositoryInterface: '@App\Repository\ReservationRepository'
    App\Repository\StayRepositoryInterface: '@App\Repository\StayRepository'
    App\Repository\TravelRepositoryInterface: '@App\Repository\TravelRepository'
    App\Repository\OptionRepositoryInterface: '@App\Repository\OptionRepository'
    App\Repository\CategoryRepositoryInterface: '@App\Repository\CategoryRepository'
    App\Repository\UserRepositoryInterface: '@App\Repository\UserRepository'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
